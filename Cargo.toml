[package]
name = "mmdf-client"
version = "1.0.0"
edition = "2021"
description = "Custom Android client using the MITM + DomainFronting method: local MITM proxy with own CA, plaintext re-send through a fronted TLS leg (benign SNI, real Host)."
license = "MIT"

[lib]
name = "mmdf_client"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "mmdf-client"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
base64 = "0.22"
bytes = "1"
httparse = "1"
tracing = "0.1"
time = "0.3"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.21.1", default-features = false }
tun2proxy = { version = "=0.7.21", default-features = false, features = ["udpgw"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
